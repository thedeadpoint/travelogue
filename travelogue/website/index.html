<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An interactive map of personal travels.">
    <title>Travel Atlas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Version 0.2</p>
        <h1>Travel Atlas</h1>
      </div>
      <p id="status" class="status" aria-live="polite">Loading trips…</p>
    </header>

    <form id="filters" class="filters" aria-label="Map filters">
      <label class="filter-field">
        <span>Year</span>
        <select id="year-filter" name="year">
          <option value="">All</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Country</span>
        <select id="country-filter" name="country">
          <option value="">All</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Category</span>
        <select id="category-filter" name="category">
          <option value="">All</option>
        </select>
      </label>
      <label class="filter-field">
        <span>Travel mode</span>
        <select id="travel-mode-filter" name="travelMode">
          <option value="">All</option>
        </select>
      </label>
      <fieldset class="marker-style">
        <legend>Marker style</legend>
        <label>
          <input type="radio" name="markerStyle" value="standard" checked>
          <span>Standard pins</span>
        </label>
        <label>
          <input type="radio" name="markerStyle" value="category">
          <span>Category symbols</span>
        </label>
      </fieldset>
      <button id="reset-filters" class="reset-filters" type="button">
        Reset filters
      </button>
      <div id="category-legend" class="category-legend" hidden>
        <span class="category-legend-title">Category symbols</span>
        <div id="category-legend-items" class="category-legend-items"></div>
      </div>
    </form>

    <section class="statistics" aria-label="Travel statistics">
      <div class="statistic">
        <span id="trips-total" class="statistic-value">—</span>
        <span class="statistic-label">Trips</span>
      </div>
      <div class="statistic">
        <span id="countries-total" class="statistic-value">—</span>
        <span class="statistic-label">Countries</span>
      </div>
      <div class="statistic">
        <span id="stops-total" class="statistic-value">—</span>
        <span class="statistic-label">Stops</span>
      </div>
      <div class="statistic">
        <span id="travel-days-total" class="statistic-value">—</span>
        <span class="statistic-label">Travel days</span>
      </div>
      <div class="statistic">
        <span id="borders-total" class="statistic-value">—</span>
        <span class="statistic-label">Borders crossed</span>
      </div>
    </section>

    <main class="map-layout">
      <aside id="trips-sidebar" class="trips-sidebar" aria-labelledby="trips-heading">
        <div class="trips-sidebar-header">
          <h2 id="trips-heading">Trips</h2>
          <div class="trips-sidebar-actions">
            <button id="clear-trip-selection" class="clear-trip-selection" type="button" hidden>
              Clear selection
            </button>
            <button
              id="trips-sidebar-toggle"
              class="trips-sidebar-toggle"
              type="button"
              aria-controls="trips-list"
              aria-expanded="true"
              aria-label="Collapse trips sidebar"
            >
              <span aria-hidden="true">‹</span>
            </button>
          </div>
        </div>
        <ol id="trips-list" class="trips-list"></ol>
      </aside>
      <div id="map" aria-label="Interactive map of trip stops"></div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>
    <script src="app.js"></script>
  </body>
</html>
